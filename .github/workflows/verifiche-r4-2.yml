name: DMC R4.2 - Verifiche complete

on:
  push:
    branches:
      - test/r4-2-persistenza-casi-limite
      - feature/r4-2-gestione-dati-integrazione
  pull_request:
  workflow_dispatch:

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js (stessa versione del deploy Cloudflare)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Test automatici
        run: node --test tests/*.test.js

      - name: ESLint senza modificare i file
        run: npx eslint .

      - name: Oxlint senza modificare i file
        run: npx oxlint .

      - name: Build di produzione
        run: npm run build
