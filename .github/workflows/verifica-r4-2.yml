name: Verifica DMC R4.2

on:
  push:
    branches:
      - audit/r4-2-affidabilita-dati
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Installa dipendenze
        run: npm ci
      - name: Build di produzione
        run: npm run build
      - name: Verifica statica senza modificare i file
        run: |
          npx oxlint .
          npx eslint .
